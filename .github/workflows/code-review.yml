name: AI Code Reviewer

on:
  push:
    branches: [ '**' ]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m ai_reviewer.review

      - name: Publish Job Summary
        if: hashFiles('review_report.md') != ''
        run: cat review_report.md >> $GITHUB_STEP_SUMMARY

      - name: Comment Review on Open PR (if one exists)
        if: hashFiles('review_report.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          if [ -n "$PR_NUM" ]; then
            gh pr comment "$PR_NUM" --body-file review_report.md --edit-last --create-if-none
          fi